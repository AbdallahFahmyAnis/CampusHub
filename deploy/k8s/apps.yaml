apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: campushub
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: campushub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: campushub/gateway:local
          imagePullPolicy: IfNotPresent
          args: ["CampusHub.Gateway.dll"]
          ports:
            - containerPort: 8080
          env:
            - name: Identity__Authority
              value: "http://localhost:5101"
            - name: Identity__MetadataAddress
              value: "http://identity:8080/.well-known/openid-configuration"
            - name: Identity__InternalAuthority
              value: "http://identity:8080"
          envFrom:
            - configMapRef:
                name: campushub-config
            - secretRef:
                name: campushub-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
