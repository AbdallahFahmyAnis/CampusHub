apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: campushub
  labels:
    app: identity
spec:
  selector:
    app: identity
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: campushub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
        - name: identity
          image: campushub/identity:local
          imagePullPolicy: IfNotPresent
          args: ["CampusHub.Identity.Api.dll"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: campushub-config
            - secretRef:
                name: campushub-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
