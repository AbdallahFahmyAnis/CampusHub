apiVersion: v1
kind: ConfigMap
metadata:
  name: campushub-config
  namespace: campushub
data:
  ASPNETCORE_URLS: "http://+:8080"
  Identity__Issuer: "http://localhost:5101/"
  Identity__Authority: "http://identity:8080"
  Identity__MetadataAddress: "http://identity:8080/.well-known/openid-configuration"
  Identity__InternalAuthority: "http://identity:8080"
  Gateway__PublicOrigin: "http://localhost:5000"
  Catalog__BaseUrl: "http://catalog:8080"
  Payment__BaseUrl: "http://payment:8080"
  Enrollment__BaseUrl: "http://enrollment:8080"
  Notification__BaseUrl: "http://notification:8080"
  Access__BaseUrl: "http://access:8080"
  CATALOG_BASE_URL: "http://catalog:8080"
  ENROLLMENT_BASE_URL: "http://enrollment:8080"
  IDENTITY_AUTHORITY: "http://localhost:5101"
  IDENTITY_ISSUER: "http://localhost:5101/"
  JWKS_URI: "http://identity:8080/.well-known/jwks"
  PORT: "8080"
  DATA_DIR: "/data"
  ConnectionStrings__identity: "Data Source=/data/identity.db"
  ConnectionStrings__catalog: "Data Source=/data/catalog.db"
  ConnectionStrings__enrollment: "Data Source=/data/enrollment.db"
  ConnectionStrings__payment: "Data Source=/data/payment.db"
  ConnectionStrings__notification: "Data Source=/data/notification.db"
  ConnectionStrings__access: "Data Source=/data/access.db"
  Services__Identity: "http://identity:8080"
  Services__Catalog: "http://catalog:8080"
  Services__Enrollment: "http://enrollment:8080"
  Services__Payment: "http://payment:8080"
  Services__Notification: "http://notification:8080"
  Services__Access: "http://access:8080"
  Services__Chat: "http://chat:8080"
  ReverseProxy__Clusters__identity__Destinations__primary__Address: "http://identity:8080/"
  ReverseProxy__Clusters__catalog__Destinations__primary__Address: "http://catalog:8080/"
  ReverseProxy__Clusters__enrollment__Destinations__primary__Address: "http://enrollment:8080/"
  ReverseProxy__Clusters__notification__Destinations__primary__Address: "http://notification:8080/"
  ReverseProxy__Clusters__access__Destinations__primary__Address: "http://access:8080/"
  ReverseProxy__Clusters__chat__Destinations__primary__Address: "http://chat:8080/"
  ReverseProxy__Clusters__shell__Destinations__primary__Address: "http://web:8080/"
  Ops__Services__0__Name: "identity"
  Ops__Services__0__Url: "http://identity:8080/health/ready"
  Ops__Services__1__Name: "catalog"
  Ops__Services__1__Url: "http://catalog:8080/health/ready"
  Ops__Services__2__Name: "enrollment"
  Ops__Services__2__Url: "http://enrollment:8080/health/ready"
  Ops__Services__3__Name: "payment"
  Ops__Services__3__Url: "http://payment:8080/health/ready"
  Ops__Services__4__Name: "notification"
  Ops__Services__4__Url: "http://notification:8080/health/ready"
  Ops__Services__5__Name: "access"
  Ops__Services__5__Url: "http://access:8080/health/ready"
  Ops__Services__6__Name: "chat"
  Ops__Services__6__Url: "http://chat:8080/health/ready"
